name: CI

# 流程：push 到远程 dev
#       → analyze + test（ubuntu）→ Windows 集成测试（windows）
#       → 全部通过后创建或复用 dev → main 的 PR，再通过 PR 合并
#       任一环节失败，main 保持不动（不会半合进去）

on:
  push:
    branches:
      - dev

# 同一分支连推时取消上一次仍在跑的检查，避免排队
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 默认最小权限；只有 merge job 需要写权限
permissions:
  contents: read

env:
  FLUTTER_CHANNEL: stable

jobs:
  analyze:
    name: flutter analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

  test:
    name: flutter test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # integration_test/ 依赖真实设备，无法在 ubuntu 无头环境运行，
      # 因此这里只跑 test/ 下的单元与 widget 测试。
      - name: Run tests
        run: flutter test --reporter expanded --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 7

  # 集成测试需要真实的 Windows 桌面与文件系统，ubuntu 上跑不了。
  # 串行：analyze + test 全绿后才跑这里；它通过后才会合并进 main。
  windows-integration:
    name: Windows integration test
    needs: [analyze, test]
    runs-on: windows-latest
    timeout-minutes: 40
    # continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # 仅用于确认 runner 上是否真的存在中文字体（本仓库测试不依赖它）
      - name: Report CJK font availability
        shell: pwsh
        run: |
          foreach ($f in 'msyh.ttc', 'segoeui.ttf', 'consola.ttf') {
            $path = Join-Path $env:WINDIR "Fonts\$f"
            Write-Host "$f exists: $(Test-Path -LiteralPath $path)"
          }

      - name: Run Windows integration test
        run: flutter test integration_test/windows_flow_test.dart -d windows --dart-define=REVIEW_DIR=build/review

      - name: Run Windows SSE integration test
        run: flutter test integration_test/sse_windows_flow_test.dart -d windows --dart-define=REVIEW_DIR=build/review

      - name: Upload integration screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-integration-screenshots
          path: build/review
          if-no-files-found: ignore
          retention-days: 7

  merge:
    name: Create and merge dev PR into main
    # 必须等 analyze + test + windows-integration 全部通过；
    # 任一失败则本 job 直接跳过，main 保持不动
    needs: [analyze, test, windows-integration]
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERIFIED_SHA: ${{ github.sha }}
    steps:
      - name: Checkout verified commit with full history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Create or reuse PR and merge verified commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev main

          # 新提交由后续 CI 验证，旧运行不能合并尚未检查的 dev 更新。
          if [ "$(git rev-parse origin/dev)" != "$VERIFIED_SHA" ]; then
            echo "dev 已更新，跳过本次合并，等待最新提交的 CI。"
            exit 0
          fi

          # 重跑已合并的提交时无需重复创建 PR。
          if git merge-base --is-ancestor "$VERIFIED_SHA" origin/main; then
            echo "本次验证的提交已在 main 中，无需合并。"
            exit 0
          fi

          # 使用 REST 查询本仓库 dev → main 的开放 PR，排除同名 fork 分支。
          # 查询遇到网络或 JSON 响应异常时有限重试；不能把查询失败当作没有 PR。
          find_pr() {
            local attempt result
            for attempt in 1 2 3; do
              if result="$(gh api --method GET "repos/$GH_REPO/pulls" \
                -f state=open -f base=main -f head="${GH_REPO%%/*}:dev" \
                --jq 'if type == "array" then .[0].html_url // empty else error("PR list response must be an array") end')"; then
                printf '%s' "$result"
                return 0
              fi
              echo "::warning::查询 PR 失败（第 $attempt/3 次），请查看上方 API 错误。" >&2
              if [ "$attempt" -lt 3 ]; then sleep 2; fi
            done
            return 1
          }

          pr_url="$(find_pr)"
          if [ -z "$pr_url" ]; then
            body_file="$RUNNER_TEMP/dev-main-pr-body.md"
            {
              printf 'dev 分支的 CI 已全部通过，申请合并到 main。\n\n'
              printf '检查：静态分析、单元与界面测试、Windows 集成测试（含 SSE）。\n\n'
              printf 'CI：%s/%s/actions/runs/%s\n\n' \
                "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
              printf '验证提交：`%s`\n\n提交列表：\n\n' "$VERIFIED_SHA"
              git log --no-merges --format='- %s (%h)' "origin/main..$VERIFIED_SHA"
            } > "$body_file"
            # REST 创建避开 gh pr create 的响应处理路径。
            # 请求失败或返回空 URL 时先查询：服务端可能已创建 PR，只是响应处理失败。
            for attempt in 1 2 3; do
              if pr_url="$(gh api --method POST "repos/$GH_REPO/pulls" \
                -f title='merge: dev into main' -f head=dev -f base=main \
                -F body=@"$body_file" --jq '.html_url // empty')" \
                && [ -n "$pr_url" ]; then
                break
              fi
              echo "::warning::创建 PR 未获得有效响应（第 $attempt/3 次），先检查是否已创建。" >&2
              pr_url="$(find_pr)"
              if [ -n "$pr_url" ]; then break; fi
              if [ "$attempt" -lt 3 ]; then sleep 2; fi
            done
            if [ -z "$pr_url" ]; then
              echo "::error::无法创建或找到 dev → main PR。请根据上方 API 错误检查仓库 PR 创建权限或 GitHub 服务状态。"
              exit 1
            fi
          fi

          printf 'PR：%s\n' "$pr_url"
          printf 'dev → main PR：%s\n' "$pr_url" >> "$GITHUB_STEP_SUMMARY"

          # 通过 GitHub 创建 merge commit，保留 dev 提交及分支。
          # 合并请求再次校验头提交，阻止创建 PR 之后发生的分支更新被带入 main。
          # 分支保护、必需审核或冲突会阻止合并，PR 保持开放供处理。
          gh pr merge "$pr_url" --merge --match-head-commit "$VERIFIED_SHA"
